
name: Extract ZIP Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          git rm --cached -r extracted/attendance-bot || true
          rm -rf extracted
          mkdir -p extracted
          unzip -o "*.zip" -d extracted

      - name: Remove nested Git repositories
        run: |
          find extracted -name .git -prune -exec rm -rf {} +

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extracted
          git commit -m "Extract project files" || true
          git push
